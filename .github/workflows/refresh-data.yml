# Pulls the latest nflverse stats every Tuesday morning, commits the updated database
# and JSON, then redeploys the site. nflverse can lag a day after Monday Night Football.
name: Refresh data

on:
  schedule:
    - cron: '0 13 * * 2' # Tuesdays 13:00 UTC (9am ET in season)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fantasy.db public/data/player_games.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh NFL stats ($(date -u +%Y-%m-%d))"
          git push
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Redeploy site
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
